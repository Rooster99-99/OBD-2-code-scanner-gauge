; OBD-II Dash Gauge firmware for the 2.8" CYD (ESP32-2432S028)
;
; Three builds, one per display chip. Start with "cyd". If the screen stays
; white/blank or the image is garbled, try "cyd_ili9341", then "cyd_st7789".
; If colors look inverted (white background), use Settings > Display > Invert.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
extra_scripts = post:tools/merge_bin.py
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    powerbroker2/ELMduino@^3.3.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Most common: ILI9341 variant used on many USB-C CYD boards
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

; Original ILI9341 driver (older micro-USB boards)
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_DRIVER=1

; ST7789 panel (some newer boards). If red and blue are swapped,
; add: -DTFT_RGB_ORDER=TFT_BGR
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
